name: Release Build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libepoxy-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Check installer
        run: bash scripts/test-install-bin.sh
      - name: Build and test
        run: |
          cargo build --release --locked --target ${{ matrix.target }} --features ci-release
          cargo test --release --locked --target ${{ matrix.target }} --features ci-release
      - name: Package
        env:
          RELEASE_NAME: satty-${{ matrix.target }}
        run: |
          mkdir "$RELEASE_NAME"
          strip "target/${{ matrix.target }}/release/satty"
          cp "target/${{ matrix.target }}/release/satty" "$RELEASE_NAME/"
          cp -r completions man assets README.md LICENSE satty.desktop "$RELEASE_NAME/"
          tar -czf "$RELEASE_NAME.tar.gz" -C "$RELEASE_NAME" .
          sha256sum "$RELEASE_NAME.tar.gz" > "$RELEASE_NAME.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: satty-${{ matrix.target }}
          path: |
            satty-${{ matrix.target }}.tar.gz
            satty-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            satty-*.tar.gz
            satty-*.tar.gz.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
